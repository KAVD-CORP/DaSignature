# Render Blueprint: DaSignature web/PWA as a Render Static Site (PM #62).
# Step-by-step guide: docs/deploy-render.md. Node comes from .node-version (20.19).
# Headers: CSP per PM #1 (same string as apps/web/csp.ts), Referrer-Policy, nosniff, Permissions-Policy
# camera=(self); caching per PM #23 (hashed assets immutable for 1 year, index.html and sw.js no-cache).
# apps/web/src/render-yaml.test.ts keeps this file in sync with apps/web/csp.ts.
services:
  - type: web
    runtime: static
    name: dasignature
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter web build
    staticPublishPath: apps/web/dist
    envVars:
      # Render would otherwise run its own npm install first; the build command installs with pnpm.
      - key: SKIP_INSTALL_DEPS
        value: 'true'
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob: data:; img-src 'self' blob: data:; font-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Permissions-Policy
        value: camera=(self)
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      # Deep paths (3+ segments) are either unhashed pdf.js data under /pdfjs/ or SPA rewrites to
      # index.html; both revalidate. Hashed assets are /assets/<file> (2 segments), so the rules
      # never overlap (Render's precedence for conflicting Cache-Control rules is undocumented).
      - path: /*/*/*
        name: Cache-Control
        value: no-cache
      - path: /doc/*
        name: Cache-Control
        value: no-cache
    routes:
      # A missing hashed asset (an old index.html after a deploy) gets a tiny text/plain body, not
      # index.html: the module load fails cleanly instead of caching HTML for a year at a .js URL.
      - type: rewrite
        source: /assets/*
        destination: /missing-asset.txt
      # SPA: every path without a file is served index.html (files are matched first).
      - type: rewrite
        source: /*
        destination: /index.html
