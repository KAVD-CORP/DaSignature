# Render Blueprint: DaSignature web/PWA as a Render Static Site (PM #62).
# Step-by-step guide: docs/deploy-render.md. Node comes from .node-version (20.19).
# Headers: CSP per PM #1 (same string as apps/web/csp.ts), Referrer-Policy, nosniff, Permissions-Policy
# camera=(self); caching per PM #23 (hashed assets immutable for 1 year, index.html and sw.js no-cache).
# apps/web/src/render-yaml.test.ts keeps this file in sync with apps/web/csp.ts.
services:
  - type: web
    runtime: static
    name: dasignature
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter web build
    staticPublishPath: apps/web/dist
    envVars:
      # Render would otherwise run its own npm install first; the build command installs with pnpm.
      - key: SKIP_INSTALL_DEPS
        value: 'true'
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob: data:; img-src 'self' blob: data:; font-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Permissions-Policy
        value: camera=(self)
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      # Deep paths (3+ segments) are either unhashed pdf.js data under /pdfjs/ or SPA rewrites to
      # index.html; both revalidate. Hashed assets are /assets/<file> (2 segments), so the rules
      # never overlap (Render's precedence for conflicting Cache-Control rules is undocumented).
      - path: /*/*/*
        name: Cache-Control
        value: no-cache
      - path: /doc/*
        name: Cache-Control
        value: no-cache
      # Public guide pages (E-108): unhashed HTML at /guides and /guides/<slug> revalidates; their
      # assets under /guides/assets/ are 3 segments, so they already get the /*/*/* no-cache above.
      - path: /guides
        name: Cache-Control
        value: no-cache
      - path: /guides/*
        name: Cache-Control
        value: no-cache
      # Crawler files at the root (E-108): short public cache; the build regenerates them.
      - path: /robots.txt
        name: Cache-Control
        value: public, max-age=3600
      - path: /sitemap.xml
        name: Cache-Control
        value: public, max-age=3600
      - path: /llms.txt
        name: Cache-Control
        value: public, max-age=3600
      - path: /llms-full.txt
        name: Cache-Control
        value: public, max-age=3600
    routes:
      # A missing hashed asset (an old index.html after a deploy) gets a tiny text/plain body, not
      # index.html: the module load fails cleanly instead of caching HTML for a year at a .js URL.
      - type: rewrite
        source: /assets/*
        destination: /missing-asset.txt
      # Guide pages are built as /guides/index.html and /guides/<slug>/index.html (E-108). If Render
      # already serves a directory's index.html at the clean URL, the file wins and these never fire;
      # if it doesn't, they map the clean URLs (with or without a trailing slash) to the files, so a guide URL
      # can never fall through to the app shell below.
      - type: rewrite
        source: /guides
        destination: /guides/index.html
      - type: rewrite
        source: /guides/
        destination: /guides/index.html
      - type: rewrite
        source: /guides/:slug
        destination: /guides/:slug/index.html
      - type: rewrite
        source: /guides/:slug/
        destination: /guides/:slug/index.html
      - type: rewrite
        source: /guides/assets/*
        destination: /missing-asset.txt
      # Guide-page analytics relay (E-112, only used when POSTHOG_KEY is set at build time): the
      # guide pages send events to same-origin /ingest/*, which Render proxies to the PostHog host,
      # so the CSP above stays unchanged. The app never calls it. If POSTHOG_HOST is changed, change
      # this destination too (the build fails if they differ). Must stay above the SPA rule.
      - type: rewrite
        source: /ingest/*
        destination: https://us.i.posthog.com/*
      # SPA: every path without a file is served index.html (files are matched first).
      - type: rewrite
        source: /*
        destination: /index.html
