[package]
name = "dasignature"
version = "0.1.0"
description = "DaSignature desktop shell"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "dasignature_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
base64 = "0.22"
# OS credential store for the database key (macOS Keychain, Windows Credential Manager, Secret Service).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
getrandom = "0.3"
tauri-plugin-dialog = "2"

# SPEC Sec 6: SQLite + SQLCipher on desktop. Linux/macOS: vendored OpenSSL (no system libssl needed).
[target.'cfg(not(windows))'.dependencies]
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }

# Windows: same SQLCipher, LibTomCrypt provider compiled by build.rs (vendor/libtomcrypt/README.md).
[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.37", features = ["bundled-sqlcipher"] }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
# Size budget: desktop installer < 20 MB (SPEC Sec 1).
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
