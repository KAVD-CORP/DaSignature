packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - esbuild

# PM decision #21: CI fails on high/critical advisories. Every ignore must be approved by PM,
# documented with a reason and an expiry milestone in audit-exceptions.json, and logged in
# docs/decisions.md. `pnpm check:audit` (scripts/check-audit.mjs) fails on an undocumented or
# expired ignore; pnpm itself has no expiry support.
auditConfig:
  ignoreGhsas: []
